name: CI/CD for Windows Pipeline

on:
  push:
    branches: [root, master]
  pull_request:
    branches: [root, master]
  release:
    types: [created]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.9', '3.10', '3.11']
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build test executable
        run: |
          pyinstaller --onefile --clean --log-level=DEBUG main.py
      
      - name: Verify executable architecture
        run: |
          # Verifica si el EXE es válido
          if (Test-Path "dist/main.exe") {
              echo "✅ EXE generado correctamente"
              # Verifica arquitectura
              $fileInfo = Get-Item "dist/main.exe"
              echo "Tamaño: $($fileInfo.Length) bytes"
          } else {
              echo "❌ No se generó el EXE"
              exit 1
          }
      
      - name: Basic EXE test (timeout 10s)
        run: |
          $process = Start-Process -FilePath "dist/main.exe" -PassThru -NoNewWindow
          # Espera máximo 10 segundos
          $process | Wait-Process -Timeout 10 -ErrorAction SilentlyContinue
          if (!$process.HasExited) {
              $process | Stop-Process -Force
              echo "⚠️ EXE no respondió en 10 segundos (puede ser normal para GUI)"
          } else {
              echo "✅ EXE se ejecutó y cerró correctamente"
          }

  build-windows-exe:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: test-compatibility
    if: github.event_name == 'release'

    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with detailed options
        run: |
          pyinstaller --onefile --windowed --clean --name "SistemaInventario" ^
                     --log-level=INFO ^
                     main.py
          
          # Verificar que el EXE se creó
          if (Test-Path "dist/SistemaInventario.exe") {
              echo "✅ Build exitoso"
              # Información del archivo
              Get-Item "dist/SistemaInventario.exe" | Format-List *
          } else {
              echo "❌ Build falló"
              exit 1
          }
      
      - name: Validate executable
        run: |
          $exePath = "dist/SistemaInventario.exe"
          
          # Verificar que es un EXE válido
          if (!(Test-Path $exePath)) {
              echo "❌ EXE no encontrado"
              exit 1
          }
          
          # Verificar tamaño (debe ser > 1MB típicamente)
          $size = (Get-Item $exePath).Length
          echo "Tamaño del EXE: $size bytes"
          
          if ($size -lt 1000000) {
              echo "⚠️ EXE muy pequeño, puede estar corrupto"
          }
          
          echo "✅ EXE parece válido"
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SistemaInventario.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NUEVO JOB: Test del EXE generado
  test-built-exe:
    name: Test Built Executable
    runs-on: windows-latest
    needs: build-windows-exe
    if: github.event_name == 'release'

    steps:
      - name: Download EXE from release
        uses: actions/download-artifact@v4
        with:
          name: SistemaInventario-Windows-${{ github.event.release.tag_name }}
      
      - name: Test EXE functionality
        run: |
          if (Test-Path "SistemaInventario.exe") {
              echo "✅ EXE descargado correctamente"
              # Test básico de ejecución
              Start-Process -FilePath "SistemaInventario.exe" -Wait -NoNewWindow
              echo "✅ EXE se ejecutó sin errores críticos"
          } else {
              echo "❌ No se pudo descargar el EXE"
          }
