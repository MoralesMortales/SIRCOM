name: CI/CD for Windows Pipeline

on:
  push:
    branches: [root, master]
  pull_request:
    branches: [root, master]
  release:
    types: [created] # Se ejecuta cuando se crea un nuevo release

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.9', '3.10', '3.11']
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala dependencias del proyecto, incluyendo PyQt5
          pip install -r requirements.txt
          pip install pytest

      - name: Test PyQt imports
        run: |
          python -c "from PyQt5 import QtWidgets, QtCore; print('PyQt imports successful')"
      
  build-windows-exe:
    name: Build Windows Executable and Upload
    runs-on: windows-latest
    needs: test # Asegura que la compilación solo corra si los tests pasan
    if: github.event_name == 'release'

    # 🔑 CLAVE: OTORGA PERMISOS DE ESCRITURA PARA EL TOKEN DE ESTE JOB
    permissions:
      contents: write # Permite al GITHUB_TOKEN modificar assets de la release
    
    steps:
      - name: Checkout code (usando el código de la etiqueta de la release)
        uses: actions/checkout@v4
        # Si insistes en usar el código de la rama 'main' más reciente, descomenta la siguiente línea:
        # with:
        #   ref: master 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          Write-Host "Iniciando build con PyInstaller..."
          pyinstaller --onefile --windowed --name "SistemaInventario" main.py
          Write-Host "Build completado. Contenido de dist/:"
          Get-ChildItem -Path dist
        timeout-minutes: 10
        shell: pwsh

      - name: Find and Verify Executable Path
        id: find_exe
        shell: bash
        run: |
          EXE_NAME="SistemaInventario.exe"
          # Esto manejará la diferencia de path en caso de onefile/onedir
          EXE_PATH=$(find dist/ -type f -name "$EXE_NAME" | head -n 1) 
          if [ -z "$EXE_PATH" ]; then
            echo "Error: $EXE_NAME no encontrado en dist/"
            exit 1
          fi
          echo "exe_path=$EXE_PATH" >> "$GITHUB_OUTPUT"
          echo "✅ EXE encontrado en: $EXE_PATH"

      - name: Upload executable to GitHub Release 🚀
        uses: softprops/action-gh-release@v2
        if: steps.find_exe.outputs.exe_path != ''
        with:
          # files: usa la ruta relativa del archivo
          files: ${{ steps.find_exe.outputs.exe_path }}
          # Usar el GITHUB_TOKEN proporcionado por el runner (que ahora tiene permisos de escritura)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload executable as artifact # Esto es opcional, solo para ver el archivo en Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SistemaInventario-Windows-${{ github.event.release.tag_name }}
          path: ${{ steps.find_exe.outputs.exe_path }}
          retention-days: 7
