name: CI/CD for Windows Pipeline

on:
  push:
    branches: [root, master]
  pull_request:
    branches: [root, master]
  release:
    types: [created]

jobs:
  # 1. TEST: Prueba del código fuente y dependencias (estable y rápido)
  test:
    name: Compatibility Tests - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    timeout-minutes: 5 # Timeout ajustado
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' 
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Test basic imports (Verifica compatibilidad con PyQt5)
        run: |
          echo "Verificando imports esenciales y que PyQt5 se cargue correctamente..."
          python -c "import sys; print('Python OK')"
          # Esta línea confirma que todas las dependencias de GUI se instalaron.
          python -c "from PyQt5 import QtWidgets, QtCore; print('PyQt5 OK')"
          
          # La ejecución de 'python main.py' ha sido movida al job 'test-built-exe' 
          # donde se puede controlar con el flag --ci-test.

---

  # 2. BUILD: Construye el EXE final (Solo se ejecuta en 'release')
  build-windows-exe:
    name: Build Windows Executable and Upload
    runs-on: windows-latest
    needs: test 
    if: github.event_name == 'release'

    permissions:
      contents: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        id: build_exe
        run: |
          $ExeName = "SistemaInventario.exe"
          # Usamos --windowed ya que es una GUI
          pyinstaller --onefile --windowed --clean --name "SistemaInventario" `
                      --log-level=INFO `
                      main.py
          
          # Verificación de que el EXE se creó y obtención de ruta para el output
          $ExePath = "dist/$ExeName"
          if (Test-Path $ExePath) {
              echo "✅ Build exitoso: $ExePath"
              echo "exe_path=$ExePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              echo "❌ Build falló. No se encontró $ExeName."
              exit 1
          }
        shell: pwsh
      
      - name: Upload executable to GitHub Release 🚀
        uses: softprops/action-gh-release@v2
        if: steps.build_exe.outputs.exe_path != ''
        with:
          files: ${{ steps.build_exe.outputs.exe_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload executable as artifact (For the next job to download)
        uses: actions/upload-artifact@v4
        with:
          name: SistemaInventario-Windows
          path: ${{ steps.build_exe.outputs.exe_path }}
          retention-days: 7
          
---

  # 3. VERIFY: Prueba el ejecutable final de forma segura
  test-built-exe:
    name: Test Built Executable Integrity
    runs-on: windows-latest
    needs: build-windows-exe 
    if: github.event_name == 'release'

    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: SistemaInventario-Windows
          
      - name: Test EXE functionality (Silent Check) ✅
        run: |
          $ExePath = "SistemaInventario-Windows/SistemaInventario.exe"
          
          if (!(Test-Path $ExePath)) {
              echo "❌ EXE no encontrado en $ExePath"
              exit 1
          }
          
          echo "✅ Ejecutando prueba de integridad silenciosa (usando --ci-test)..."
          
          # 🔑 CLAVE: Usamos el argumento --ci-test. El EXE ahora se ejecutará,
          # inicializará la DB, imprimirá el mensaje de salida y cerrará inmediatamente.
          $process = Start-Process -FilePath $ExePath -ArgumentList "--ci-test" -Wait -PassThru -NoNewWindow
          $ExitCode = $process.ExitCode
          
          if ($ExitCode -eq 0) {
              echo "✅ EXE ejecutado, prueba de integridad silenciosa OK (Código 0)."
          } else {
              echo "❌ EXE falló la prueba silenciosa. Código de salida: $ExitCode. Esto significa que initialize_db() o un import falló dentro del ejecutable."
              exit 1
          }
        shell: pwsh
