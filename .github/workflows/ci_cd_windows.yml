name: CI/CD for Windows Pipeline

on:
  push:
    branches: [root, master]
  pull_request:
    branches: [root, master]
  release:
    types: [created]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.9', '3.10', '3.11']
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Test PyQt imports
      run: |
        python -c "from PyQt5 import QtWidgets, QtCore; print('PyQt imports successful')"
    
  build-windows-exe:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: test 
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "SistemaInventario" main.py
      timeout-minutes: 10
    
    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: SistemaInventario-Windows
        path: dist/SistemaInventario.exe
        retention-days: 7
    
    - name: Upload to release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/SistemaInventario.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
