name: Build Windows EXE on Release

on:
  release:
    types: [published] # Se activa cuando se publica una nueva release

jobs:
  build_windows_exe:
    runs-on: windows-latest # Ejecutar en un runner de Windows

    steps:
      - name: Checkout código
        uses: actions/checkout@v4 # Clona el repositorio

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Usa la versión de Python que necesites (ej. '3.10', '3.x')
          architecture: 'x64'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyqt5 # Instala PyInstaller y PyQt5
          # Si tienes un requirements.txt, usa: pip install -r requirements.txt

      - name: Compilar el ejecutable con PyInstaller
        # Usa el nombre de tu archivo principal, que es 'main.py'
        # --onefile: Crea un solo archivo ejecutable
        # --windowed: Oculta la consola de comandos de Windows (útil para aplicaciones PyQt)
        # --name: Define el nombre del ejecutable de salida
        run: |
          pyinstaller main.py --onefile --windowed --name "NombreDeTuApp"

      - name: Obtener el nombre del archivo EXE
        id: get_exe_name
        run: |
          $exeName = "NombreDeTuApp.exe"
          echo "exe_path=dist\$exeName" >> $env:GITHUB_OUTPUT
          
      - name: Subir el artefacto a la Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.get_exe_name.outputs.exe_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token automático para permisos de release
