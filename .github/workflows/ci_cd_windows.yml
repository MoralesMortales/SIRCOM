name: CI/CD for Windows Pipeline

on:
  push:
    branches: [root, master]
  pull_request:
    branches: [root, master]
  release:
    types: [created]

jobs:
  # 1. TEST: Prueba del código fuente y dependencias
  test:
    name: Compatibility Tests - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' 
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Test basic imports
        run: |
          python -c "import sys; print('Python OK')"
          python -c "from PyQt5 import QtWidgets, QtCore; print('PyQt5 OK')"

  # 2. BUILD: Construye el EXE final
  build-windows-exe:
    name: Build Windows Executable - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    needs: test 
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    permissions:
      contents: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        id: build_exe
        run: |
          $ExeName = "SistemaInventario-Py${{ matrix.python-version }}.exe"
          pyinstaller --onefile --windowed --clean --name "SistemaInventario-Py${{ matrix.python-version }}" `
                      --log-level=INFO `
                      main.py
          
          $ExePath = "dist/SistemaInventario-Py${{ matrix.python-version }}.exe"
          if (Test-Path $ExePath) {
              echo "✅ Build exitoso: $ExePath"
              echo "exe_path=$ExePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              echo "❌ Build falló. No se encontró $ExeName."
              exit 1
          }
        shell: pwsh
      
      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SistemaInventario-Py${{ matrix.python-version }}
          path: ${{ steps.build_exe.outputs.exe_path }}
          retention-days: 7
          
      - name: Upload to GitHub Release (Conditional)
        if: github.event_name == 'release' && steps.build_exe.outputs.exe_path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build_exe.outputs.exe_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. VERIFY: Prueba el ejecutable final
  test-built-exe:
    name: Test Built Executable - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    needs: build-windows-exe 
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: SistemaInventario-Py${{ matrix.python-version }}
          
      - name: Test EXE functionality
        run: |
          $ExePath = "SistemaInventario-Py${{ matrix.python-version }}.exe"
          
          if (!(Test-Path $ExePath)) {
              echo "❌ EXE no encontrado en $ExePath"
              exit 1
          }
          
          echo "✅ Probando EXE built with Python ${{ matrix.python-version }}"
          $process = Start-Process -FilePath $ExePath -ArgumentList "--ci-test" -Wait -PassThru -NoNewWindow
          
          if ($process.ExitCode -eq 0) {
              echo "✅ EXE Python ${{ matrix.python-version }} - Prueba OK"
          } else {
              echo "❌ EXE Python ${{ matrix.python-version }} - Falló. Código: $process.ExitCode"
              exit 1
          }
        shell: pwsh
