name: CI/CD for Windows Pipeline

on:
  push:
    branches: [root, master]
  pull_request:
    branches: [root, master]
  release:
    types: [created]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.9', '3.10', '3.11']
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Test PyQt imports
      run: |
        python -c "from PyQt5 import QtWidgets, QtCore; print('PyQt imports successful')"
    
  build-windows-exe:
      name: Build Windows Executable
      runs-on: windows-latest
      needs: test 
      if: github.event_name == 'release'
      
      steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Debug - Print workspace
        run: |
          echo "Directorio de trabajo: $PWD"
          ls -la
          echo "-----------------------------------"
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Debug - Check Python version
        run: |
          echo "Python version:"
          python --version
          echo "Pip version:"
          pip --version
          echo "-----------------------------------"
      
      - name: Install dependencies
        run: |
          echo "Instalando dependencias..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          echo "Dependencias instaladas"
          echo "-----------------------------------"
      
      - name: Debug - Check installed packages
        run: |
          echo "Paquetes instalados:"
          pip list
          echo "-----------------------------------"
      
      - name: Build executable
        run: |
          echo "Iniciando build con PyInstaller..."
          echo "Archivos en directorio actual:"
          ls -la
          echo "Contenido de main.py (primeras 10 líneas):"
          head -10 main.py || type main.py
          pyinstaller --onefile --windowed --name "SistemaInventario" main.py
          echo "Build completado"
          echo "Contenido de dist/:"
          ls -la dist/ || echo "No existe dist/"
          echo "-----------------------------------"
        timeout-minutes: 10
      
      - name: Debug - Check dist directory
        run: |
          echo "Verificando archivo ejecutable..."
          if [ -f "dist/SistemaInventario.exe" ]; then
              echo "✅ EXE encontrado! Tamaño:"
              ls -lh "dist/SistemaInventario.exe"
          else
              echo "❌ EXE NO encontrado. Contenido de dist/:"
              ls -la dist/ || echo "No existe dist/"
          fi
          echo "-----------------------------------"
      
      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SistemaInventario-Windows
          path: dist/SistemaInventario.exe
          retention-days: 7    # - name: Upload to release

    #   uses: softprops/action-gh-release@v2
    #   if: startsWith(github.ref, 'refs/tags/')
    #   with:
    #     files: dist/SistemaInventario.exe
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
