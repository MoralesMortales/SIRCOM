name: CI/CD for Windows Pipeline

on:
  push:
    branches: [root, master]
  pull_request:
    branches: [root, master]
  release:
    types: [created]

jobs:
  # 1. TEST: Prueba del código fuente en múltiples versiones de Python
  test:
    name: Compatibility Tests - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' 
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Test basic imports
        run: |
          python -c "import sys; print('Python OK')"
          python -c "from PyQt5 import QtWidgets, QtCore; print('PyQt5 OK')"
          python -c "import sqlite3; print('SQLite3 OK')"

  # 2. BUILD: Construye el directorio con el EXE y recursos
  build-windows-exe:
    name: Build Windows Executable (OneDir)
    runs-on: windows-latest
    needs: test

    permissions:
      contents: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Create database directory and sample file
        run: |
          # Crear estructura de directorios y DB de ejemplo si no existe
          New-Item -ItemType Directory -Path "app/database" -Force
          New-Item -ItemType Directory -Path "app/images" -Force
          New-Item -ItemType Directory -Path "app/config" -Force
          
          # Crear un archivo de base de datos vacío si no existe
          if (!(Test-Path "app/database/database.db")) {
              echo "Creando base de datos vacía para el build..."
              $null > app/database/database.db
          }
        shell: pwsh
      
      - name: Build executable with .spec file (OneDir)
        id: build_exe
        run: |
          # Limpiar builds anteriores
          if (Test-Path "dist") {
              Remove-Item -Path "dist" -Recurse -Force
          }
          
          # Usar el archivo .spec para construir
          pyinstaller build.spec
          
          # Verificar la estructura creada
          $DirPath = "dist/SistemaInventario"
          echo "=== ESTRUCTURA CREADA POR PYINSTALLER ==="
          if (Test-Path $DirPath) {
              Get-ChildItem -Path $DirPath -Recurse | ForEach-Object { 
                  $relativePath = $_.FullName.Replace((Get-Location).Path + "\", "")
                  echo "  $relativePath"
              }
          } else {
              echo "❌ No se creó el directorio $DirPath"
              echo "=== CONTENIDO DE dist/ ==="
              Get-ChildItem -Path "dist" -Recurse
              exit 1
          }
          
          $ExePath = "$DirPath/SistemaInventario.exe"
          
          if (Test-Path $ExePath) {
              echo "✅ Build exitoso"
              echo "Exe: $ExePath"
              
              echo "exe_path=$ExePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              echo "dir_path=$DirPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              echo "❌ Build falló. No se encontró el ejecutable."
              echo "Archivos en $DirPath:"
              Get-ChildItem -Path $DirPath
              exit 1
          }
        shell: pwsh
      
      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SistemaInventario-Windows-OneDir
          path: dist/SistemaInventario/
          retention-days: 7
          
      - name: Create ZIP package for release
        id: create_zip
        run: |
          $DirPath = "${{ steps.build_exe.outputs.dir_path }}"
          $ZipPath = "dist/SistemaInventario.zip"
          
          # Crear ZIP del directorio completo
          Compress-Archive -Path $DirPath -DestinationPath $ZipPath -Force
          
          if (Test-Path $ZipPath) {
              echo "✅ ZIP creado: $ZipPath"
              echo "zip_path=$ZipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
        shell: pwsh
          
      - name: Upload to GitHub Release (Conditional) 🚀
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build_exe.outputs.dir_path }}/SistemaInventario.exe
            ${{ steps.create_zip.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. VERIFY: Prueba el ejecutable final
  test-built-exe:
    name: Test Built Executable Integrity
    runs-on: windows-latest
    needs: build-windows-exe

    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: SistemaInventario-Windows-OneDir
          
      - name: Diagnose downloaded artifact structure
        run: |
          echo "=== DIAGNÓSTICO DE LA ESTRUCTURA DESCARGADA ==="
          echo "Directorio actual de trabajo:"
          Get-Location
          
          echo "=== CONTENIDO DEL DIRECTORIO RAÍZ ==="
          Get-ChildItem -Path . | ForEach-Object { 
              if ($_.PSIsContainer) {
                  echo "📁 $($_.Name)/"
              } else {
                  echo "📄 $($_.Name)"
              }
          }
          
          echo "=== BUSQUEDA RECURSIVA DE .EXE ==="
          $exeFiles = Get-ChildItem -Path . -Filter "*.exe" -Recurse -File
          if ($exeFiles.Count -gt 0) {
              echo "✅ Archivos .exe encontrados:"
              $exeFiles | ForEach-Object { 
                  echo "  → $($_.FullName)"
                  $ExePath = $_.FullName
              }
          } else {
              echo "❌ No se encontraron archivos .exe"
              echo "=== ESTRUCTURA COMPLETA RECURSIVA ==="
              Get-ChildItem -Path . -Recurse | ForEach-Object { 
                  $indent = "  " * ($_.FullName.Split('\').Length - 1)
                  if ($_.PSIsContainer) {
                      echo "$indent📁 $($_.Name)/"
                  } else {
                      echo "$indent📄 $($_.Name)"
                  }
              }
              exit 1
          }
          
          # Verificar directorio del EXE
          $exeDir = [System.IO.Path]::GetDirectoryName($ExePath)
          echo "=== CONTENIDO DEL DIRECTORIO DEL EXE ==="
          Get-ChildItem -Path $exeDir | ForEach-Object { 
              if ($_.PSIsContainer) {
                  echo "📁 $($_.Name)/"
              } else {
                  echo "📄 $($_.Name)"
              }
          }
          
          echo "✅ EXE path definitivo: $ExePath"
          echo "exe_path=$ExePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh
      
      - name: Test EXE functionality
        run: |
          # Usar la ruta detectada en el paso anterior
          $ExePath = "${{ steps.diagnose.outputs.exe_path }}"
          
          if (!(Test-Path $ExePath)) {
              echo "❌ EXE no encontrado en $ExePath"
              exit 1
          }
          
          echo "✅ Probando EXE: $ExePath"
          
          # Ejecutar prueba
          $output = & $ExePath --ci-test 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          
          echo "=== SALIDA DEL EXE ==="
          echo $output
          echo "======================"
          echo "Código de salida: $exitCode"
          
          # Verificar resultado
          if ($exitCode -eq 0) {
              if ($output -match "Error connecting the DB|Error inesperado|Traceback|Exception") {
                  echo "❌ EXE mostró errores a pesar de código de salida 0"
                  exit 1
              }
              echo "✅ EXE - Prueba OK (sin errores)"
          } else {
              echo "❌ EXE - Falló. Código: $exitCode"
              exit 1
          }
        shell: pwsh
        env:
          ExePath: ${{ steps.diagnose.outputs.exe_path }}
