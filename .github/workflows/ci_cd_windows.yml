name: CI/CD for Windows Pipeline

on:
  push:
    branches: [root, master]
  pull_request:
    branches: [root, master]
  release:
    types: [created]

jobs:
  # 1. TEST: Solo prueba el código Python y las dependencias (rápido y estable)
  test:
    name: Compatibility Tests - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    timeout-minutes: 5 # Reducido, ya que solo hace pruebas de código
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Usa caché para acelerar dependencias
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Instalamos PyInstaller solo si realmente lo necesitamos para un test específico (opcional)
          # pip install pyinstaller
      
      - name: Test basic functionality (Python Only)
        run: |
          echo "Verificando imports y funcionalidad sin GUI..."
          python -c "import sys; print('Python OK')"
          python -c "from PyQt5 import QtWidgets; print('PyQt5 OK')"
          

---

  # 2. BUILD: Construye el EXE final (Solo se ejecuta en 'release')
  build-windows-exe:
    name: Build Windows Executable and Upload
    runs-on: windows-latest
    needs: test # Asegura que la compilación solo corra si todos los tests pasan
    if: github.event_name == 'release'

    permissions:
      contents: write # Requerido para subir el asset a la Release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Versión fija para el build final
          cache: 'pip'
      
      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        id: build_exe
        run: |
          $ExeName = "SistemaInventario.exe"
          pyinstaller --onefile --windowed --clean --name "SistemaInventario" `
                      --log-level=INFO `
                      main.py
          
          # Verificar y subir ruta como output para el siguiente paso
          $ExePath = "dist/$ExeName"
          if (Test-Path $ExePath) {
              echo "✅ Build exitoso: $ExePath"
              echo "exe_path=$ExePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              echo "❌ Build falló. No se encontró $ExeName."
              exit 1
          }
        shell: pwsh
      
      - name: Upload executable to GitHub Release 🚀
        uses: softprops/action-gh-release@v2
        if: steps.build_exe.outputs.exe_path != ''
        with:
          files: ${{ steps.build_exe.outputs.exe_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload executable as artifact (For the next job to download)
        uses: actions/upload-artifact@v4
        with:
          name: SistemaInventario-Windows
          path: ${{ steps.build_exe.outputs.exe_path }}
          retention-days: 7
          
---

  # 3. VERIFY: Prueba el ejecutable recién creado descargándolo como artefacto (estable)
  test-built-exe:
    name: Test Built Executable
    runs-on: windows-latest
    needs: build-windows-exe # Necesita que el build haya terminado
    if: github.event_name == 'release'

    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: SistemaInventario-Windows
          # La ruta de descarga será 'SistemaInventario-Windows/SistemaInventario.exe'
          
      - name: Test EXE functionality (Safer approach)
        run: |
          $ExePath = "SistemaInventario-Windows/SistemaInventario.exe"
          if (Test-Path $ExePath) {
              echo "✅ EXE descargado correctamente"
              
              # Intenta ejecutar la GUI y espera un corto tiempo para ver si arranca sin error crítico.
              # Usar -NoNewWindow puede ser más estable que Start-Process solo
              & $ExePath
              
              echo "✅ EXE ejecutado. Si fallara, el runner habría detenido este job."
              # NOTA: Si el EXE tiene un bug en el inicio, este paso fallará. 
              # Si es una GUI, se cerrará después del timeout del job si no se cierra por código.
              
          } else {
              echo "❌ No se pudo encontrar el EXE en $ExePath"
              exit 1
          }
